    function shuffle(array) {
      const copy = [...array];
      for (let i=copy.length-1;i>0;i--) {
        const j=Math.floor(Math.random()*(i+1));
        [copy[i],copy[j]]=[copy[j],copy[i]];
      }

              }
              if (type==="alphabet") selected=generateSelectionWithOverlap(alphabet,previousSelection);
              if (type==="hiragana") selected=generateSelectionWithOverlap(hiragana,previousSelection);
              if (isValidSelection(selected,previousSelection)) break;
            }
            if (type==="number") selected.sort((a,b)=>a-b);
            if (type==="alphabet") selected.sort();
            if (type==="hiragana") selected.sort((a,b)=>hiragana.indexOf(a)-hiragana.indexOf(b));
          }
        } else {
          groupType=groupTypes[match-1];
          selected=generateCardNumberSelection(previousCardSelections[groupType]);
          previousCardSelections[groupType]=[...selected];
        }
        matches.push({match, selected, groupType});
        previousSelection=[...selected];
      }
      return {date:currentDateKey, type, matchCount, matches, updatedAt: new Date().toISOString()};
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      }[ch]));
    }

    function matchSummary(match, result) {
      if (result.type==="cardNumber") {
        return `${match.groupType==="ones"?"1の位":"10の位"}：${match.selected.join("・")}`;
      }
      return match.selected.join("　");
    }

    function renderResult(result) {
      currentResult=result;
      const resultEl=document.getElementById("result");
      if (!result) {
        resultEl.innerHTML='<div class="empty-state">札分けの種類を選んでください。</div>';
        document.getElementById("status").textContent="本日の札分けはまだ生成されていません。";
        return;
      }
      const modeName=modeNames[result.type] || "札分け";
      document.getElementById("status").textContent="";
      resultEl.innerHTML=result.matches.map(m=>`
        <div class="match">
          <button class="match-title" aria-label="${m.match}試合目の札一覧を表示" onclick="openCards(${m.match})">${m.match}試合目</button>
          <div class="match-content">${escapeHtml(matchSummary(m,result))}</div>
        </div>`).join("");
    }

    function cardsForMatch(match, result) {
      if (result.type==="cardNumber") {
        const groupType=match.groupType;
        // cards配列はExcelに記載された決まり字順なので、並べ替えず元の順序を維持する。
        return cards.filter(card => {
          if (groupType==="ones") return match.selected.includes(card["札番号"] % 10);
          const tensDigit=card["札番号"]===100 ? 0 : Math.floor(card["札番号"]/10);
          return match.selected.includes(tensDigit);
        });
      }
      const column={number:"数字", alphabet:"アルファベット", hiragana:"ひらがな"}[result.type];
      // Excelの行順（決まり字順）を維持し、選ばれた分類に該当する札だけを抽出する。
      return cards.filter(card=>match.selected.includes(card[column]));
    }

    window.openCards = function(matchNumber) {
      if (!currentResult) return;
      const match=currentResult.matches.find(m=>m.match===matchNumber);
      if (!match) return;
      const list=cardsForMatch(match,currentResult);
      document.getElementById("panelTitle").textContent=`${matchNumber}試合目の札一覧`;
      document.getElementById("cardsPanelContent").innerHTML=`
        <div class="card-name-list">${list.map(c=>`<span class="card-name">${escapeHtml(c["札名"])}</span>`).join("")}</div>`;
      document.getElementById("cardsOverlay").classList.add("open");
    };
    window.closeCards = function(){document.getElementById("cardsOverlay").classList.remove("open");};
    window.closeCardsIfBackdrop = function(event){if(event.target.id==="cardsOverlay") window.closeCards();};

    function setBusy(value) {
      busy=value;
      document.querySelectorAll(".button-area button, #matchCount").forEach(el=>el.disabled=value);
    }

    async function loadTodayResult() {
      currentDateKey=getJapanDateKey();
      displayToday();
      document.getElementById("status").textContent="本日の共有札分けを確認しています…";
      try {
        const ref=doc(db,"dailySplits",currentDateKey);
        const snap=await getDoc(ref);
        if (getJapanDateKey()!==currentDateKey) return handleDateChange();
        if (snap.exists()) renderResult(snap.data());
        else renderResult(null);
      } catch(error) {
        console.error(error);
        document.getElementById("status").textContent="共有結果を取得できませんでした。ネット接続とFirebase設定を確認してください。";
        renderResult(null);
      }
    }

    async function generate(type) {
      if (busy) return;
      setBusy(true);
      try {
        const dateKey=getJapanDateKey();
        if (dateKey!==currentDateKey) {
          currentDateKey=dateKey;
          await loadTodayResult();
        }
        const ref=doc(db,"dailySplits",currentDateKey);
        const initialSnap=await getDoc(ref);
        let forceReplace=false;

        if (initialSnap.exists()) {
          const existing=initialSnap.data();
          const message=`本日の札分けは生成済みです（${modeNames[existing.type] || "札分け"}・${existing.matchCount}試合）。\n再生成すると全員に表示される札分けが変更されます。\n再生成しますか？`;
          if (!window.confirm(message)) return;
          forceReplace=true;
        }

        const candidate=buildNewResult(type,parseInt(document.getElementById("matchCount").value,10));
        const outcome=await runTransaction(db,async transaction=>{
          const snap=await transaction.get(ref);
          if (!snap.exists()) {
            transaction.set(ref,{...candidate, createdAt:serverTimestamp(), updatedAt:serverTimestamp()});
            return {result:candidate, created:true};
          }
          if (!forceReplace) {
            return {result:snap.data(), created:false};
          }
          transaction.set(ref,{...candidate, createdAt:snap.data().createdAt || serverTimestamp(), updatedAt:serverTimestamp()});
          return {result:candidate, created:true};
        });

        if (outcome.created) {
          renderResult(outcome.result);
          document.getElementById("status").textContent="";
        } else {
          renderResult(outcome.result);
          alert("ほかの人が先に本日の札分けを生成しました。共有されている結果を表示します。");
        }
      } catch(error) {
        console.error(error);
        alert("札分けの共有に失敗しました。\nFirebaseの設定とFirestoreのルールを確認してください。\n詳細："+(error?.message || error));
      } finally {
        setBusy(false);
      }
    }
    window.generate=generate;

    async function handleDateChange() {
      const newKey=getJapanDateKey();
      if (newKey===currentDateKey) return;
      currentDateKey=newKey;
      renderResult(null);
      await loadTodayResult();
    }

    displayToday();
    loadTodayResult();
    setInterval(handleDateChange,15000);
  </script>
</body>
</html>
